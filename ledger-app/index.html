<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0EA5A4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="记账本" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <title>记账本</title>
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="topbar-title">记账本</h1>
        <button id="btn-settings-global" class="icon-btn" aria-label="设置">⚙</button>
      </div>
    </header>

    <!-- 主体视图容器 -->
    <main id="view-container"></main>

    <!-- 底部导航 -->
    <nav class="tabbar">
      <button class="tab" data-view="add"><span class="tab-ico">＋</span><span class="tab-tx">记账</span></button>
      <button class="tab" data-view="stats"><span class="tab-ico">📊</span><span class="tab-tx">统计</span></button>
      <button class="tab" data-view="budget"><span class="tab-ico">🔔</span><span class="tab-tx">预算</span></button>
      <button class="tab" data-view="mine"><span class="tab-ico">👤</span><span class="tab-tx">我的</span></button>
    </nav>
  </div>

  <!-- 通用弹窗/提示层 -->
  <div id="toast" class="toast"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
